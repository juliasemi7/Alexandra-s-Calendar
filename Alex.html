<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 — Alex's Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            /* Distinct soft colors for each package */
            --pkg-1-bg: #dcfce7; --pkg-1-text: #15803d; /* Jan-Feb */
            --pkg-2-bg: #ffedd5; --pkg-2-text: #c2410c; /* Feb-Mar */
            --pkg-3-bg: #e0e7ff; --pkg-3-text: #4338ca; /* Mar-Apr */
            --pkg-4-bg: #fef9c3; --pkg-4-text: #a16207; /* Apr-May */
            --pkg-5-bg: #f3e8ff; --pkg-5-text: #7e22ce; /* May-Jun */
            --pkg-sep-bg: #fef3c7; --pkg-sep-text: #b45309; /* September package warm amber */
            --pkg-oct-bg: #ffe4e6; --pkg-oct-text: #be123c; /* October package soft rose */
        }
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #1e293b;
            min-height: 100vh;
        }
        /* Package classes */
        .pkg-1 { background-color: var(--pkg-1-bg); color: var(--pkg-1-text); font-weight: 700; }
        .pkg-2 { background-color: var(--pkg-2-bg); color: var(--pkg-2-text); font-weight: 700; }
        .pkg-3 { background-color: var(--pkg-3-bg); color: var(--pkg-3-text); font-weight: 700; }
        .pkg-4 { background-color: var(--pkg-4-bg); color: var(--pkg-4-text); font-weight: 700; }
        .pkg-5 { background-color: var(--pkg-5-bg); color: var(--pkg-5-text); font-weight: 700; }
        .pkg-september { background-color: var(--pkg-sep-bg); color: var(--pkg-sep-text); font-weight: 700; }
        .pkg-october { background-color: var(--pkg-oct-bg); color: var(--pkg-oct-text); font-weight: 700; }
        .weekend {
            background-color: #fef2f2;
            color: #ef4444;
        }
        .other-month {
            color: #cbd5e1;
            font-weight: 400;
        }
        /* Alex's lesson indicator (Tuesday & Friday) */
        .alex-lesson {
            box-shadow: inset 0 0 0 2px #2563eb;
            font-weight: 800 !important;
            position: relative;
        }
        .alex-lesson::after {
            content: '';
            position: absolute;
            top: 3px;
            right: 3px;
            width: 5px;
            height: 5px;
            background-color: #2563eb;
            border-radius: 50%;
        }
    </style>
</head>
<body class="p-4 sm:p-8 font-sans antialiased">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 text-center flex flex-col items-center justify-center gap-3">
            <div class="inline-flex items-center gap-2 px-4 py-1.5 bg-blue-600 text-white font-extrabold rounded-full text-sm shadow-md shadow-blue-500/20 tracking-wider">
                <span>2026</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">Alex's Calendar</h1>
        </header>
        <main>
            <div id="calendarGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </main>
        
        <!-- Legend -->
        <div class="mt-10 bg-white border border-slate-200/80 rounded-2xl p-6 shadow-sm flex flex-wrap items-center justify-center gap-6">
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-700">
                <span class="w-4 h-4 rounded bg-[#fef2f2] border border-red-200"></span> Выходные
            </div>
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-700">
                <span class="w-4 h-4 rounded" style="background-color: var(--pkg-sep-bg);"></span> Пакет (Сентябрь)
            </div>
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-700">
                <span class="w-4 h-4 rounded" style="background-color: var(--pkg-oct-bg);"></span> Пакет (Октябрь)
            </div>
            <div class="flex items-center gap-2 text-xs font-semibold text-slate-700">
                <span class="w-4 h-4 rounded bg-white" style="box-shadow: inset 0 0 0 2px #2563eb;"></span> День занятия (Вт, Пт)
            </div>
        </div>

        <footer class="mt-12 text-center text-xs font-medium text-slate-400">
            © 2026 Alex's Calendar
        </footer>
    </div>
    <script>
        const year = 2026;
        const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        const weekDays = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

        function generateWorkingDays(startDateStr, count = 20) {
            let dates = [];
            let curr = new Date(startDateStr);
            while (dates.length < count) {
                let dayOfWeek = curr.getDay();
                if (dayOfWeek !== 0 && dayOfWeek !== 6) {
                    let y = curr.getFullYear();
                    let m = String(curr.getMonth() + 1).padStart(2, '0');
                    let d = String(curr.getDate()).padStart(2, '0');
                    dates.push(`${y}-${m}-${d}`);
                }
                curr.setDate(curr.getDate() + 1);
            }
            return dates;
        }

        const pkg1 = generateWorkingDays("2026-02-02", 20);
        const pkg2 = generateWorkingDays("2026-03-02", 20);
        const pkg3 = generateWorkingDays("2026-04-01", 20);
        const pkg4 = generateWorkingDays("2026-05-04", 20);
        const pkg5 = generateWorkingDays("2026-06-01", 20);
        const septemberPackage = generateWorkingDays("2026-09-04", 20);
        const octoberPackage = generateWorkingDays("2026-10-01", 20);

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getStartOffset(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                const daysCount = getDaysInMonth(year, m);
                const startDay = getStartOffset(year, m);
                const totalCells = Math.ceil((startDay + daysCount) / 7) * 7;

                let monthHtml = `
                    <div class="bg-white border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden flex flex-col">
                        <div class="bg-slate-50/80 border-b border-slate-100 py-3 text-center font-extrabold text-slate-800 text-sm uppercase tracking-wider">
                            ${months[m]} ${year}
                        </div>
                        <div class="p-4 flex-1">
                            <table class="w-full border-collapse">
                                <thead>
                                    <tr>
                `;

                for (let dName of weekDays) {
                    monthHtml += `<th class="py-1.5 text-[11px] font-bold text-slate-400 text-center">${dName}</th>`;
                }
                monthHtml += `</tr></thead><tbody>`;

                let currentDay = 1;
                for (let i = 0; i < totalCells; i++) {
                    if (i % 7 === 0) monthHtml += `<tr>`;

                    if (i >= startDay && currentDay <= daysCount) {
                        const dateStr = formatDate(year, m, currentDay);
                        const dateObj = new Date(year, m, currentDay);
                        const dayOfWeek = dateObj.getDay(); // 0: Sun, 5: Fri, 2: Tue, 6: Sat
                        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                        let classNames = "w-8 h-8 mx-auto my-0.5 rounded-xl flex items-center justify-center text-xs transition-all";

                        let pkgClass = "";
                        if (pkg1.includes(dateStr)) pkgClass = "pkg-1";
                        else if (pkg2.includes(dateStr)) pkgClass = "pkg-2";
                        else if (pkg3.includes(dateStr)) pkgClass = "pkg-3";
                        else if (pkg4.includes(dateStr)) pkgClass = "pkg-4";
                        else if (pkg5.includes(dateStr)) pkgClass = "pkg-5";
                        else if (septemberPackage.includes(dateStr)) pkgClass = "pkg-september";
                        else if (octoberPackage.includes(dateStr)) pkgClass = "pkg-october";

                        const isLesson = (pkgClass !== "") && (dayOfWeek === 2 || dayOfWeek === 5);

                        if (isLesson) {
                            classNames += ` alex-lesson ${pkgClass}`;
                        } else if (pkgClass) {
                            classNames += ` ${pkgClass}`;
                        } else if (isWeekend) {
                            classNames += ` weekend`;
                        } else {
                            classNames += ` text-slate-600 hover:bg-slate-100 font-medium`;
                        }

                        monthHtml += `<td><div class="${classNames}">${currentDay}</div></td>`;
                        currentDay++;
                    } else {
                        monthHtml += `<td><div class="w-8 h-8 mx-auto my-0.5 rounded-xl flex items-center justify-center text-xs other-month">-</div></td>`;
                    }

                    if (i % 7 === 6) monthHtml += `</tr>`;
                }

                monthHtml += `</tbody></table></div></div>`;
                grid.innerHTML += monthHtml;
            }
        }

        renderCalendar();
    </script>
</body>
</html>
